name: Test scripts

# Unit tests for the shared scripts (the merge line's picker), on every PR that touches them.
on:
  pull_request:
    paths: ['.github/scripts/**', '.github/workflows/test-scripts.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test .github/scripts/
